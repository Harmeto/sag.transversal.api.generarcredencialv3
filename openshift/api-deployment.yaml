apiVersion: apps/v1
kind: Deployment
metadata:
  name: generarcredencialv3
  labels:
    app.kubernetes.io/name: generarcredencialv3
    app.kubernetes.io/part-of: generarcredencialv3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generarcredencialv3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generarcredencialv3
        app.kubernetes.io/part-of: generarcredencialv3
    spec:
      containers:
        - name: api
          # Reemplazar antes de aplicar, o con `oc set image` según openshift/README.md.
          image: quay.io/REEMPLAZAR_USUARIO/generarcredencialv3:3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3345
              name: http
          envFrom:
            - configMapRef:
                name: generarcredencialv3-api
            - secretRef:
                name: generarcredencialv3-api
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          readinessProbe:
            httpGet:
              path: /api/v3/transversal/credencial/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v3/transversal/credencial/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: generarcredencialv3-storage
